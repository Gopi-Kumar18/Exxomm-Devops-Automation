# docker-compose.yml

services:
  backend:
    build: ./exxomm-be
    image: exxomm-be-image:latest 
    ports:
      - "3000:3000"
    environment:
    # passing environment variables to backend container while creating it
      MONGO_USER: "${MONGO_USER}"
      MONGO_PASS: "${MONGO_PASS}"
      MONGO_DB_NAME: "${MONGO_DB_NAME}"
      JWT_SECRET: "${JWT_SECRET}"
      
    depends_on:
      - mongo
    networks:
      - exxomm-net

  frontend:
    build: ./exxomm-fe
    image: exxomm-fe-image:latest 
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - exxomm-net

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
    # passing environment variables to mongo container while creating it
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - exxomm_db_volume:/data/db
    networks:
      - exxomm-net

volumes:
  exxomm_db_volume:
    name: exxomm_db_volume


networks:
  exxomm-net:
    driver: bridge