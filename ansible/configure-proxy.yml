#         Ansible exxomm (sites-available/exxomm)

# Designed as a central reverse proxy/gateway on a host in your network.

# location / proxies all traffic to a separate frontend server (proxy_pass http://{{ frontend_private_ip }}:3000;).

# location /api proxies to the backend (:8000).

# Nginx here does no static file serving — it forwards everything to other servers.

---

- name: Configure Nginx Reverse Proxy
  hosts: proxy
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Remove default Nginx config
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Create Exxomm Proxy Configuration
      copy:
        dest: /etc/nginx/sites-available/exxomm
        content: |

          server {
              listen 80;

              # Frontend Routing
              location / {
                  proxy_pass http://{{ frontend_private_ip }}:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }

              # Backend Routing
              location /api {
                  proxy_pass http://{{ backend_private_ip }}:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }

    - name: Enable the new configuration
      file:
        src: /etc/nginx/sites-available/exxomm
        dest: /etc/nginx/sites-enabled/exxomm
        state: link

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted